# DNABERT-2 Token Classification - PRODUCTION CONFIGURATION TEMPLATE
#
# Copy this file and replace REPLACE_WITH_YOUR_PATH placeholders
# with actual paths for your system.
#
# Usage:
#   cp production.template.yaml my_production.yaml
#   nano my_production.yaml  # Edit paths
#   python scripts/training/train_token_classification_automodel.py --config config/my_production.yaml
#

# ============================================================
# Model Configuration
# ============================================================
model:
  name_or_path: "zhihan1996/DNABERT-2-117M"
  num_labels: 2  # Binary classification: 0=background, 1=TE
  problem_type: "single_label_classification"

# ============================================================
# Data Configuration
# ============================================================
data:
  # MODIFY THIS: Path to your combined dataset directory
  dataset_path: "REPLACE_WITH_YOUR_PATH/datasets_combined/40_species"
  train_split: "train"
  validation_split: "val"
  test_split: "test"

  # Data is already tokenized
  max_length: 512
  is_pretokenized: true

# ============================================================
# Training Hyperparameters
# ============================================================
training:
  # Class imbalance handling
  use_focal_loss: false
  use_dynamic_class_weights: true  # Recommended: sklearn balanced weights
  imbalance_ratio: null  # Use dynamic calculation from dataset

  # Feature extraction approach (frozen base model)
  freeze_base_model: false  # true = feature extraction, false = full fine-tuning

  # Learning rate (adjust based on freeze_base_model):
  # - If freeze_base_model = true:  Use 2e-4 to 5e-4 (high LR for classifier)
  # - If freeze_base_model = false: Use 1e-5 to 5e-5 (low LR for fine-tuning)
  learning_rate: 2.0e-5  # HIGH LR for frozen base + classifier training
  num_train_epochs: 10
  per_device_train_batch_size: 24  # Adjust based on GPU memory
  per_device_eval_batch_size: 192
  gradient_accumulation_steps: 3  # Effective global batch ~72
  eval_accumulation_steps: 32

  # Optimization
  weight_decay: 0.01
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1.0e-8
  max_grad_norm: 1.0

  # Learning rate schedule
  lr_scheduler_type: "cosine"
  warmup_steps: 500

  # Mixed precision training
  fp16: true
  fp16_opt_level: "O1"

  # Evaluation and saving
  evaluation_strategy: "steps"
  eval_steps: 500  # Evaluate every 500 steps
  save_strategy: "steps"
  save_steps: 500
  save_total_limit: 5
  load_best_model_at_end: true
  metric_for_best_model: "eval_f1"
  greater_is_better: true

  # Logging
  logging_strategy: "steps"
  logging_steps: 50
  logging_first_step: true
  report_to: "tensorboard"

  # Misc
  seed: 42
  # CRITICAL: These settings prevent multiprocessing errors
  dataloader_num_workers: 0
  dataloader_pin_memory: false
  ignore_data_skip: false

# ============================================================
# Early Stopping Configuration
# ============================================================
early_stopping:
  enabled: true
  patience: 10  # Stop if no improvement for 10 evaluations (5000 steps)
  threshold: 0.0
  min_epochs: 1

# ============================================================
# Hardware Configuration
# ============================================================
hardware:
  num_gpus: 1
  distributed_backend: "nccl"
  gradient_checkpointing: false  # Set to true if OOM
  optim: "adamw_torch"

# ============================================================
# Output Configuration
# ============================================================
output:
  # MODIFY THIS: Output directory for checkpoints and logs
  output_dir: "REPLACE_WITH_YOUR_PATH/results/production_run"
  logging_dir: "REPLACE_WITH_YOUR_PATH/results/production_run/logs"
  run_name: "production_run"

# ============================================================
# Evaluation Metrics
# ============================================================
metrics:
  compute_metrics:
    - "accuracy"
    - "precision"
    - "recall"
    - "f1"
  average: "binary"
  ignore_index: -100

# ============================================================
# Advanced Options
# ============================================================
advanced:
  resume_from_checkpoint: null
  max_eval_samples: 25000  # Limit validation to prevent OOM
  debug_mode: false
  push_to_hub: false
  hub_model_id: null
  hub_token: null
  sharded_ddp: false
  deepspeed: null

# ============================================================
# Species-specific Evaluation
# ============================================================
species_eval:
  enabled: false
