name: autotrim_env
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  # Python
  - python=3.9
  
  # Mamba packages
  - opencv
  - pymupdf
  - bioconductor-biostrings=2.70.1
  - r-base=4.3.3
  - blast
  - r-rcpp
  - emboss
  - ncbi-datasets-cli
  - pip
  

  # Install with pip
  - pip:
      - "numpy<2"
      - matplotlib
      - scikit-learn
      - tensorflow==2.8.0
      - keras==2.8.0
      - protobuf==3.15.8
      
prefix: /shared/home/sorozcoarias/anaconda3/envs/autotrim_env
